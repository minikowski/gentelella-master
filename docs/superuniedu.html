<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Unificado - Aviso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4e54c8;
            --secondary-color: #8f94fb;
            --accent-color: #ff7e5f;
            --text-color: #333;
            --light-color: #f8f9fa;
            --gradient: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--gradient);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
            z-index: -1;
        }
        
        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--accent-color);
            border-radius: 2px;
        }
        
        h2 {
            color: var(--secondary-color);
            font-size: 1.8rem;
            margin-top: 20px;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .message {
            background-color: var(--light-color);
            padding: 25px;
            border-radius: 12px;
            font-size: 1.2rem;
            margin: 30px 0;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-left: 5px solid var(--accent-color);
        }
        
        .icon {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .decoration {
            position: absolute;
            opacity: 0.1;
            z-index: -1;
        }
        
        .decoration.circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--accent-color);
            top: -50px;
            right: -50px;
        }
        
        .decoration.triangle {
            width: 0;
            height: 0;
            border-left: 80px solid transparent;
            border-right: 80px solid transparent;
            border-bottom: 140px solid var(--primary-color);
            bottom: -70px;
            left: -70px;
            transform: rotate(15deg);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin: 30px 0;
            height: 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 65%;
            background: var(--gradient);
            border-radius: 10px;
            animation: progress-animation 3s ease-in-out infinite;
        }
        
        @keyframes progress-animation {
            0% { width: 65%; }
            50% { width: 70%; }
            100% { width: 65%; }
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decoration circle"></div>
        <div class="decoration triangle"></div>
        
        <div class="icon">
            <i class="fas fa-cogs"></i>
        </div>
        
        <h1>Sistema Unificado</h1>
        <h2>Aviso</h2>
        
        <div class="message">
            <i class="fas fa-exclamation-circle" style="margin-right: 10px;"></i>
            Esta aba ainda está em fase de elaboração
        </div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <div class="footer">
            <i class="far fa-clock"></i> Em desenvolvimento | 
            <i class="fas fa-code"></i> Versão 0.9.5 |
            <i class="fas fa-hard-hat"></i> Construção
        </div>
    </div>
</body>
</html>
