<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Teste de Visualizações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            line-height: 1.5;
        }

        .panel {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
        }

        .panel-header {
            padding: 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            text-align: center;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .panel-subtitle {
            font-size: 0.875rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .panel-body {
            padding: 32px 24px;
        }

        .select-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .select-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-light);
        }

        #view-selector {
            width: 100%;
            padding: 14px 52px 14px 16px;
            font-size: 0.9375rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: white;
            color: var(--text);
            appearance: none;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        #view-selector:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .select-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-light);
        }

        .info-text {
            font-size: 0.8125rem;
            color: var(--text-light);
            text-align: center;
            margin-top: 16px;
        }

        .powered-by {
            font-size: 0.75rem;
            color: var(--text-light);
            text-align: center;
            margin-top: 32px;
            opacity: 0.7;
        }

        /* Efeito hover moderno */
        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Animação quando muda seleção */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .panel-body:has(#view-selector:focus) {
            animation: pulse 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="panel-header">
            <h1 class="panel-title">Painel de Teste Unificado</h1>
            <p class="panel-subtitle">Selecione um perfil para visualização</p>
        </div>
        <div class="panel-body">
            <div class="select-wrapper">
                <label for="view-selector" class="select-label">Perfil de usuário</label>
                <select id="view-selector">
                    <option value="">-- Selecione uma opção --</option>
                    <option value="https://minikowski.github.io/gentelella-master/UNIFICADO.html">Acesso Ilimitado</option>
                    <option value="https://minikowski.github.io/gentelella-master/UNIFICADO2.html">Educador(a) Social</option>
                    <option value="https://minikowski.github.io/gentelella-master/UNIFICADO3.html">Supervisão e Apoio</option>
                    <option value="https://minikowski.github.io/gentelella-master/UNIFICADO4.html">Social</option>
                </select>
                <div class="select-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>
            <p class="info-text">O sistema será aberto em uma nova aba do navegador</p>
            <p class="powered-by">Sistema de Testes © 2023</p>
        </div>
    </div>

    <script>
        document.getElementById('view-selector').addEventListener('change', function() {
            const url = this.value;
            if (url) {
                // Adiciona efeito visual antes de abrir
                document.querySelector('.panel').style.transform = 'scale(0.98)';
                setTimeout(() => {
                    window.open(url, '_blank');
                    this.value = '';
                    document.querySelector('.panel').style.transform = '';
                }, 150);
            }
        });
    </script>
</body>
</html>
