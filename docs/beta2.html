<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Unificado Otimizado com Palavras-Chave</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      background: #f8f9fa;
    }
    header, footer {
      background: #343a40;
      color: white;
      text-align: center;
      padding: 10px;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      line-height: 1.5;
    }
    .user-message {
      background: #007bff;
      color: white;
      margin-left: auto;
    }
    .bot-message {
      background: #e9ecef;
      color: black;
      margin-right: auto;
      white-space: pre-wrap;
    }
    #input-container {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 10px;
      background: white;
    }
    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-left: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <h2>Sistema Unificado</h2>
  </header>

  <div id="chat-container">
    <div class="message bot-message">Olá! Faça uma pergunta sobre o Pacto de Convivência.</div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Ex: Pode usar boné?">
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <footer>
    Desenvolvido por Victor Luis Minikowski (Otimizado por IA)
  </footer>

  <script>
    /**
     * NOVA ESTRUTURA: BASE DE CONHECIMENTO
     * Cada objeto contém:
     * - `keywords`: Uma lista de palavras-chave e sinônimos que ativam esta resposta.
     * - `text`: A resposta completa a ser exibida.
     */
    const knowledgeBase = [
      {
        keywords: ['orientação', 'ajuda', 'propor', 'atividades', 'colaboradores'],
        text: 'DIREITO: Solicitar orientação a qualquer colaborador da entidade e propor atividades colaborativas com educadores, colegas e comunidade.'
      },
      {
        keywords: ['espaços', 'sala', 'laboratório', 'quadra', 'pátio', 'refeitório', 'reserva', 'usar'],
        text: 'DIREITO: Utilizar os espaços institucionais de aprendizado e convivência social (sala de atividades, laboratório de inclusão digital, sala de leitura, laboratório de panificação, quadra, pátio e refeitório) prezando pela organização e reserva previamente destes espaços.'
      },
      {
        keywords: ['comida', 'lanche', 'almoço', 'refeição', 'cardápio', 'consumir'],
        text: 'DIREITO: Consumir livremente o lanche e almoço oferecido de acordo com o cardápio nutricional da entidade respeitando os horários vigentes.'
      },
      {
        keywords: ['celular', 'telefone', 'aparelho'],
        text: 'DIREITO: Utilizar o celular antes de adentrar nas salas de atividades, com exceção no momento do almoço/refeitório.\n\nDEVER: É de total responsabilidade dos educandos cuidar de seus pertences. O educador irá armazenar o celular, fone de ouvido, etc. no case porta celular.'
      },
      {
        keywords: ['carregar', 'tomada', 'carregador'],
        text: 'DEVER (Ressalva): A entidade NÃO pode pegar o celular para carregar, bem como emprestar o carregador para uso, contudo permitimos que o educando utilize o tempo do almoço para realizar o carregamento nas tomadas do pátio, consequentemente a responsabilidade, o cuidado e o monitoramento do celular é do educando.'
      },
      {
        keywords: ['camiseta', 'uniforme', 'vestimenta', 'empréstimo', 'roupa'],
        text: 'DIREITO: Receber duas camisetas gratuitamente, uma única vez, e caso necessite devido avarias ou manchas, poderá receber outra, mediante avaliação da equipe técnica.\n\nDEVER: Apresentar-se adequadamente uniformizado com camiseta da Guarda Mirim. \n\nRessalva: Educandos que comparecerem sem uniforme na instituição serão encaminhados pelo Educador para a Secretaria para que seja feito o empréstimo.'
      },
      {
        keywords: ['calçado', 'tênis', 'chinelo', 'salto', 'sapato'],
        text: 'DIREITO (Ressalva 1): É permitido a utilização de qualquer tipo de calçado, exceto salto acima de 3cm e exceto chinelo/descalços nas atividades esportivas, onde os educandos precisam estar com calçado fechado.'
      },
      {
        keywords: ['short', 'saia', 'vestido', 'bermuda', 'calça', 'destroyed', 'curto'],
        text: 'DIREITO (Ressalva 2): Em relação à vestimenta, é permitido qualquer tipo de peça debaixo (calça/bermuda/saia/vestido), exceto as que ficam mais que 7 cm acima do joelho e transparentes. Calças destroyed são permitidas, desde que não exponham partes íntimas.'
      },
      {
        keywords: ['atraso', 'saída', 'antecipada', 'sair', 'entrar', 'autorização'],
        text: 'DIREITO: Obter permissão de atraso e saídas antecipadas, obrigatoriamente a partir do contato telefônico com o responsável. As autorizações de entrada e saída serão emitidas pela supervisão da unidade.'
      },
      {
        keywords: ['falta', 'ausência', 'justificar', 'atestado'],
        text: 'DIREITO: Justificar as ausências com a supervisão da unidade, apresentando os devidos atestados médicos, odontológicos, etc. \n\nRessalva: A entidade apenas considera abono de falta os atestados médicos e odontológicos (somente extração), entregues no prazo de 72 horas.'
      },
      {
        keywords: ['remédio', 'medicação', 'medicamento', 'receita'],
        text: 'DIREITO: Fazer uso de medicação prescrita por médico em horário necessário desde que apresentado o receituário original. \n\nRessalva: A entidade não pode medicar e/ou fornecer o medicamento aos educandos.'
      },
      {
        keywords: ['saúde', 'doente', 'passando mal'],
        text: 'DIREITO: Caso apresente algum problema de saúde, notificar o educador presente em seu coletivo e em seguida dirigir-se à secretaria para que seja feito o contato com seu responsável.'
      },
      {
        keywords: ['música', 'som', 'funk', 'rap', 'playlist', 'ritmo'],
        text: 'DIREITO (Ressalvas): Durante os intervalos a música poderá ser socializada no pátio com uma playlist aprovada pela coordenação, que não faça apologia a criminalidade ou violência. A entidade preza para que os ritmos rap e funk não sejam utilizados, visando apresentar diversidade musical. Utilizar somente música instrumental durante as atividades em sala.'
      },
      {
        keywords: ['pertences', 'mochila', 'roubo', 'furto', 'guarda-volume'],
        text: 'DEVER: É de total responsabilidade dos educandos, com ciência de sua família, cuidar de seus pertences, não cabendo a entidade a responsabilidade de reembolso em caso de roubo ou furto dos mesmos. No início das atividades diárias será disponibilizado guarda volume.'
      },
      {
        keywords: ['patrimônio', 'danificar', 'quebrar', 'indenizar', 'prejuízo', 'rabiscar', 'pixar'],
        text: 'DEVER (Ressalva): Serão submetidos às orientações e encaminhamentos os educandos que danificarem e/ou extraviar o patrimônio da entidade, tendo que indenizar o prejuízo através da reposição em âmbito individual ou coletivo.'
      },
      {
        keywords: ['crachá', 'identificação'],
        text: 'DEVER: Utilizar o crachá de identificação diariamente de modo visível no pescoço. O crachá deverá ser devolvido, obrigatoriamente, no encerramento dos vínculos com a entidade.'
      },
      {
        keywords: ['bicicleta', 'skate', 'patins', 'transporte', 'moto'],
        text: 'PROIBIÇÃO: Deslocar-se no trajeto casa à entidade e vice-versa utilizando bicicleta, skate, roller/patins ou motocicleta, devido a entidade não possuir ambiente para guardar com segurança, exceto para unidades rurais com termo assinado.'
      },
      {
        keywords: ['boné', 'gorro', 'touca', 'capuz', 'óculos', 'sol', 'turbante', 'adereço'],
        text: 'PROIBIÇÃO: Uso de qualquer vestimenta e adereço complementar ao uniforme: boné, gorro, óculos de sol, turbante, lenços, etc.\n\nRessalva: Toucas e capuz serão permitidos, exclusivamente, no período de outono e inverno, nos espaços externos das salas de atividades (pátio).'
      },
      {
        keywords: ['respeito', 'educação', 'gírias', 'palavrão', 'ofender', 'apelido', 'briga', 'agredir', 'agressão'],
        text: 'DEVER: Dirigir-se aos colegas, educadores e demais com respeito e educação, utilizando-se de vocabulário adequado, sem gírias e vulgar.\n\nPROIBIÇÃO: Ofender ou agredir fisicamente, verbalmente ou moralmente. A entidade repudia quaisquer tipos de violência.'
      },
      {
        keywords: ['comida', 'trazer', 'bala', 'chiclete', 'pirulito', 'refrigerante', 'bebida', 'dieta'],
        text: 'PROIBIÇÃO: Trazer e/ou consumir qualquer tipo de alimento (sólido ou líquido) inclusive balas, chicletes, pirulitos e outros, exceto água.\n\nRessalva: Educandos com dieta especial (intolerância, diabetes, etc.) deverão comunicar a entidade na matrícula. Não autorizamos que o educando traga alimentos de casa.'
      },
      {
        keywords: ['bebida', 'álcool', 'cigarro', 'narguille', 'drogas', 'arma', 'faca'],
        text: 'PROIBIÇÃO: Trazer e/ou consumir e/ou ter ingerido bebidas alcoólicas, substâncias psicoativas tóxicas lícitas e ilícitas; utilizar equipamentos eletrônicos (cigarro, narguille), portar armas brancas ou de fogo. O material será recolhido e os responsáveis comunicados.'
      },
      {
        keywords: ['namoro', 'namorar', 'beijo', 'abraço', 'carícia', 'colo'],
        text: 'PROIBIÇÃO: Namorar ou expressar carícias nas dependências da entidade. A entidade respeita o namoro, porém não pactuamos com abraço, beijos, carícias e sentar no colo entre os namorados(as) e colegas.'
      },
      {
        keywords: ['dormir', 'deitar', 'sono'],
        text: 'PROIBIÇÃO: Dormir, deitar, debruçar nas salas de atividades. Caso o educando esteja se sentindo mal ou com muito sono, poderá procurar a pedagoga/supervisão para tomar as providências.'
      },
    ];

    function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user-message");
      input.value = "";

      setTimeout(() => {
        const response = getBestMatch(message);
        addMessage(response, "bot-message");
      }, 300);
    }

    function addMessage(text, className) {
      const container = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.className = `message ${className}`;
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }
    
    // Lista de palavras comuns para ignorar
    const stopWords = new Set(['a', 'o', 'e', 'é', 'de', 'do', 'da', 'em', 'um', 'uma', 'com', 'como', 'para', 'por', 'que', 'qual', 'os', 'as', 'são', 'ser', 'posso', 'pode', 'devo', 'fazer', 'usar', 'sobre']);

    function getBestMatch(query) {
      // Limpa a pergunta do usuário, mantendo apenas as palavras relevantes
      const queryWords = query.toLowerCase()
                              .split(/[\s,.;:!?]+/)
                              .filter(word => word && !stopWords.has(word));

      if (queryWords.length === 0) {
        return "Por favor, faça uma pergunta mais específica.";
      }

      let bestMatch = { score: 0, text: "Desculpe, não encontrei uma resposta exata. Tente usar palavras-chave como 'uniforme', 'celular' ou 'atraso'." };

      // Itera sobre a base de conhecimento
      for (const item of knowledgeBase) {
        let currentScore = 0;
        // Verifica se alguma palavra da pergunta corresponde às palavras-chave do item
        for (const queryWord of queryWords) {
          if (item.keywords.includes(queryWord)) {
            currentScore++;
          }
        }

        // Se a pontuação deste item for a maior até agora, ele se torna a melhor resposta
        if (currentScore > bestMatch.score) {
          bestMatch = { score: currentScore, text: item.text };
        }
      }

      return bestMatch.text;
    }

    // Listener para a tecla "Enter"
    document.getElementById("user-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
