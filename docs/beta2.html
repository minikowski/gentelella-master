    function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user-message");
      input.value = "";

      setTimeout(() => {
        const response = getBestMatch(message);
        addMessage(response, "bot-message");
      }, 500);
    }

    function addMessage(text, className) {
      const container = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.className = `message ${className}`;
      div.innerHTML = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function getBestMatch(query) {
      const queryWords = query.toLowerCase().split(/\W+/).filter(Boolean);
      const sentences = baseText.split(/[.!?]/);
      let bestSentence = "Nenhum trecho encontrado.";
      let maxScore = 0;

      for (let sentence of sentences) {
        const sentenceWords = sentence.toLowerCase().split(/\W+/);
        let score = queryWords.filter(word => sentenceWords.includes(word)).length;
        if (score > maxScore) {
          maxScore = score;
          bestSentence = sentence.trim();
        }
      }

      return bestSentence || "Nenhum trecho encontrado.";
    }

    document.getElementById("user-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
